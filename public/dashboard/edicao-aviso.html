<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichos da Metrópole | Novo Avistamento</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body class="dashboard-page avistamento-page" onload="validarSessao()">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="dashboard-brand" href="./dashboard.html" aria-label="Bichos da Metrópole - Dashboard">
                <img src="../assets/assets-home/Bichos da Metrópole em Pixel Art 1.png" alt="Bichos da Metrópole">
            </a>

            <nav class="dashboard-nav" aria-label="Navegação principal">
                <a class="dashboard-nav-item" href="./dashboard.html">Dashboard</a>
                <a class="dashboard-nav-item" href="./cards.html">Meu Bestiário</a>
                <a class="dashboard-nav-item" href="./mural.html">Histórico</a>
            </nav>

            <a class="dashboard-action active-action" href="./edicao-aviso.html"><span>Registrar avistamento</span></a>

            <span id="b_usuario" class="usuario-invisivel" aria-hidden="true">usuário</span>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <h1>NOVO AVISTAMENTO</h1>
                <p>Registre o animal que acabou de visualizar.</p>
            </header>

            <section class="avistamento-form-card" aria-label="Formulário de avistamento">
                <form class="avistamento-form" onsubmit="return registrarAvistamento()">
                    <label class="avistamento-field field-full">
                        <span>Espécie encontrada</span>
                        <select id="especieEncontrada">
                            <option value="" selected disabled>Selecione uma espécie do catálogo</option>
                            <option value="bem-te-vi">Bem-te-vi</option>
                            <option value="capivara">Capivara</option>
                            <option value="sabia-laranjeira">Sabiá-laranjeira</option>
                            <option value="tucano-bico-verde">Tucano-bico-verde</option>
                            <option value="gamba">Gambá</option>
                            <option value="coruja-buraqueira">Coruja-buraqueira</option>
                        </select>
                    </label>

                    <div class="avistamento-grid">
                        <label class="avistamento-field">
                            <span>Data do avistamento</span>
                            <input id="dataAvistamento" type="text" placeholder="dd/mm/aa">
                        </label>

                        <label class="avistamento-field">
                            <span>Local do avistamento</span>
                            <input id="localAvistamento" type="text" placeholder="Ex: Parque Villa-Lobos">
                        </label>
                    </div>

                    <button class="avistamento-submit" type="submit">Registrar avistamento</button>
                </form>
            </section>
        </main>
    </div>

    <script>
        function registrarAvistamento() {
            var especie = document.getElementById('especieEncontrada').value;
            var data = document.getElementById('dataAvistamento').value.trim();
            var local = document.getElementById('localAvistamento').value.trim();

            if (!especie || !data || !local) {
                window.alert('Preencha espécie, data e local para continuar.');
                return false;
            }

            window.alert('Avistamento registrado na interface. A integração com o backend será ligada na próxima etapa.');
            return false;
        }
    </script>
</body>

</html>

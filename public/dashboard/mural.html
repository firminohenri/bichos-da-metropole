<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichos da Metrópole | Histórico</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body class="dashboard-page history-page" onload="validarSessao(), iniciarHistorico()">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="dashboard-brand" href="./dashboard.html" aria-label="Bichos da Metrópole - Dashboard">
                <img src="../assets/assets-home/Bichos da Metrópole em Pixel Art 1.png" alt="Bichos da Metrópole">
            </a>

            <nav class="dashboard-nav" aria-label="Navegação principal">
                <a class="dashboard-nav-item" href="./dashboard.html">Dashboard</a>
                <a class="dashboard-nav-item" href="./cards.html">Meu Bestiário</a>
                <a class="dashboard-nav-item active" href="./mural.html">Histórico</a>
            </nav>

            <a class="dashboard-action" href="./edicao-aviso.html"><span>Registrar avistamento</span></a>

            <span id="b_usuario" class="usuario-invisivel" aria-hidden="true">usuário</span>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <h1>HISTÓRICO</h1>
                <p>Consulte os animais que você encontrou pela cidade.</p>
            </header>

            <section class="history-summary" aria-label="Resumo do histórico">
                <article class="history-total-card">
                    <h2>TOTAL DE AVISTAMENTOS</h2>
                    <span class="history-total" id="totalAvistamentos">28</span>
                </article>
            </section>

            <section class="history-filters" aria-label="Filtros de histórico">
                <label class="history-search-field" for="buscarHistorico">
                    <span>Buscar</span>
                    <input id="buscarHistorico" type="search" placeholder="Buscar animal registrado" oninput="renderizarHistorico()">
                </label>

                <label class="history-date-field" for="dataInicial">
                    <span>De:</span>
                    <input id="dataInicial" type="text" placeholder="dd/mm/aa" oninput="renderizarHistorico()">
                </label>

                <label class="history-date-field" for="dataFinal">
                    <span>Até:</span>
                    <input id="dataFinal" type="text" placeholder="dd/mm/aa" oninput="renderizarHistorico()">
                </label>
            </section>

            <section class="history-records-card" aria-label="Registros do histórico">
                <div class="records-header history-header">
                    <h2>MEUS REGISTROS</h2>
                    <span id="registrosExibidos">4 exibidos</span>
                </div>

                <div class="history-list" id="historyList"></div>
            </section>
        </main>
    </div>

    <script>
        var registrosHistorico = [
            {
                nome: 'Capivara',
                cientifico: 'Hydrochoerus hydrochaeris',
                local: 'Parque Ibirapuera',
                data: '10/10/2026',
                grupo: 'Mamífero'
            },
            {
                nome: 'Bem-te-vi',
                cientifico: 'Pitangus sulphuratus',
                local: 'Parque Villa-Lobos',
                data: '02/11/2026',
                grupo: 'Ave'
            },
            {
                nome: 'Sabiá-laranjeira',
                cientifico: 'Turdus rufiventris',
                local: 'Praça da Sé',
                data: '06/11/2026',
                grupo: 'Ave'
            },
            {
                nome: 'Coruja-buraqueira',
                cientifico: 'Athene cunicularia',
                local: 'Vila Mariana',
                data: '10/11/2026',
                grupo: 'Ave'
            }
        ];

        function iniciarHistorico() {
            document.getElementById('totalAvistamentos').textContent = '28';
            renderizarHistorico();
        }

        function renderizarHistorico() {
            var busca = document.getElementById('buscarHistorico').value.toLowerCase().trim();
            var dataInicial = document.getElementById('dataInicial').value.trim();
            var dataFinal = document.getElementById('dataFinal').value.trim();
            var lista = document.getElementById('historyList');
            lista.innerHTML = '';

            var exibidos = 0;

            for (var i = 0; i < registrosHistorico.length; i++) {
                var registro = registrosHistorico[i];
                var combinaBusca = registro.nome.toLowerCase().indexOf(busca) !== -1 || registro.cientifico.toLowerCase().indexOf(busca) !== -1 || registro.local.toLowerCase().indexOf(busca) !== -1 || registro.grupo.toLowerCase().indexOf(busca) !== -1;
                var combinaInicio = !dataInicial || registro.data >= dataInicial;
                var combinaFim = !dataFinal || registro.data <= dataFinal;

                if (!combinaBusca || !combinaInicio || !combinaFim) {
                    continue;
                }

                exibidos++;

                lista.innerHTML += `
                    <article class="history-item">
                        <div class="history-item-main">
                            <h3>${registro.nome}</h3>
                            <p>${registro.cientifico}</p>
                            <span>${registro.local}</span>
                        </div>
                        <div class="history-item-meta">
                            <strong>${registro.data}</strong>
                            <span>${registro.grupo}</span>
                        </div>
                    </article>
                `;
            }

            document.getElementById('registrosExibidos').textContent = exibidos + ' exibidos';
        }
    </script>
</body>

</html>

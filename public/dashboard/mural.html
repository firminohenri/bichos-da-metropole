<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichos da Metrópole | Histórico</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body class="dashboard-page history-page" onload="validarSessao(), carregarHistorico()">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="dashboard-brand" href="./dashboard.html" aria-label="Bichos da Metrópole - Dashboard">
                <img src="../assets/assets-home/Bichos da Metrópole em Pixel Art 1.png" alt="Bichos da Metrópole">
            </a>

            <nav class="dashboard-nav" aria-label="Navegação principal">
                <a class="dashboard-nav-item" href="./dashboard.html">Dashboard</a>
                <a class="dashboard-nav-item" href="./cards.html">Meu Bestiário</a>
                <a class="dashboard-nav-item active" href="./mural.html">Histórico</a>
            </nav>

            <a class="dashboard-action" href="./edicao-aviso.html"><span>Registrar avistamento</span></a>

            <span id="b_usuario" class="usuario-invisivel" aria-hidden="true">usuário</span>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <div class="dashboard-header-copy">
                    <h1>HISTÓRICO</h1>
                    <p>Consulte os animais que você encontrou pela cidade.</p>
                </div>
                <button class="dashboard-logout" type="button" onclick="limparSessao()"><span>Sair</span></button>
            </header>

            <section class="history-summary" aria-label="Resumo do histórico">
                <article class="history-total-card">
                    <h2>TOTAL DE AVISTAMENTOS</h2>
                    <span class="history-total" id="totalAvistamentos">0</span>
                </article>
            </section>

            <section class="history-filters" aria-label="Filtros de histórico">
                <label class="history-search-field" for="buscarHistorico">
                    <span>Buscar</span>
                    <input id="buscarHistorico" type="search" placeholder="Buscar animal registrado" oninput="paginaHistoricoAtual = 1; renderizarHistorico()">
                </label>

            </section>

            <section class="history-records-card" aria-label="Registros do histórico">
                <div class="records-header history-header">
                    <h2>MEUS REGISTROS</h2>
                    <span id="registrosExibidos">0 exibidos</span>
                </div>

                <div class="history-list" id="historyList"></div>

                <section class="pagination-bar" aria-label="Paginação do histórico">
                    <button class="pagination-button" type="button" id="btnHistoricoAnterior" onclick="mudarPaginaHistorico(-1)">Anterior</button>
                    <span class="pagination-info" id="paginationHistoricoInfo">Página 1 de 1</span>
                    <button class="pagination-button" type="button" id="btnHistoricoProxima" onclick="mudarPaginaHistorico(1)">Próxima</button>
                </section>
            </section>
        </main>
    </div>

    <script>
        var registrosHistorico = [];
        var paginaHistoricoAtual = 1;
        var itensHistoricoPorPagina = 3;

        function carregarHistorico() {
            var idUsuario = sessionStorage.ID_USUARIO;

            fetch(`/avistamentos/listar/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
                if (response.status == 204) {
                    registrosHistorico = [];
                    document.getElementById('totalAvistamentos').textContent = '0';
                    paginaHistoricoAtual = 1;
                    renderizarHistorico();
                } else if (response.ok) {
                    response.json().then(function (resultado) {
                        registrosHistorico = resultado;
                        document.getElementById('totalAvistamentos').textContent = resultado.length;
                        paginaHistoricoAtual = 1;
                        renderizarHistorico();
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            }).catch(function (erro) {
                console.error('Erro ao carregar histórico:', erro.message);
            });
        }

        function renderizarHistorico() {
            var busca = document.getElementById('buscarHistorico').value.toLowerCase().trim();
            var lista = document.getElementById('historyList');
            lista.innerHTML = '';

            var registrosFiltrados = [];

            for (var i = 0; i < registrosHistorico.length; i++) {
                var registro = registrosHistorico[i];
                var combinaBusca = registro.nomePopular.toLowerCase().indexOf(busca) !== -1 || registro.nomeCientifico.toLowerCase().indexOf(busca) !== -1 || registro.localAvistamento.toLowerCase().indexOf(busca) !== -1 || registro.grupo.toLowerCase().indexOf(busca) !== -1;
                if (!combinaBusca) {
                    continue;
                }

                registrosFiltrados.push(registro);
            }

            var totalPaginas = registrosFiltrados.length > 0 ? Math.ceil(registrosFiltrados.length / itensHistoricoPorPagina) : 1;

            if (paginaHistoricoAtual > totalPaginas) {
                paginaHistoricoAtual = totalPaginas;
            }

            var inicio = (paginaHistoricoAtual - 1) * itensHistoricoPorPagina;
            var fim = inicio + itensHistoricoPorPagina;
            var registrosDaPagina = registrosFiltrados.slice(inicio, fim);

            for (var j = 0; j < registrosDaPagina.length; j++) {
                var registroPagina = registrosDaPagina[j];

                lista.innerHTML += `
                    <article class="history-item">
                        <div class="history-item-main">
                            <h3>${registroPagina.nomePopular}</h3>
                            <p>${registroPagina.nomeCientifico}</p>
                            <span>${registroPagina.localAvistamento}</span>
                        </div>
                        <div class="history-item-meta">
                            <strong>${registroPagina.dataAvistamento}</strong>
                            <span>${registroPagina.grupo}</span>
                        </div>
                    </article>
                `;
            }

            document.getElementById('registrosExibidos').textContent = registrosFiltrados.length + ' exibidos';
            atualizarPaginacaoHistorico(registrosFiltrados.length, totalPaginas);
        }

        function mudarPaginaHistorico(direcao) {
            var totalPaginas = obterQuantidadePaginasHistorico();
            var proximaPagina = paginaHistoricoAtual + direcao;

            if (proximaPagina < 1 || proximaPagina > totalPaginas) {
                return;
            }

            paginaHistoricoAtual = proximaPagina;
            renderizarHistorico();
        }

        function obterQuantidadePaginasHistorico() {
            var busca = document.getElementById('buscarHistorico').value.toLowerCase().trim();
            var totalFiltrado = 0;

            for (var i = 0; i < registrosHistorico.length; i++) {
                var registro = registrosHistorico[i];
                var combinaBusca = registro.nomePopular.toLowerCase().indexOf(busca) !== -1 || registro.nomeCientifico.toLowerCase().indexOf(busca) !== -1 || registro.localAvistamento.toLowerCase().indexOf(busca) !== -1 || registro.grupo.toLowerCase().indexOf(busca) !== -1;
                if (combinaBusca) {
                    totalFiltrado++;
                }
            }

            return totalFiltrado > 0 ? Math.ceil(totalFiltrado / itensHistoricoPorPagina) : 1;
        }

        function atualizarPaginacaoHistorico(totalItens, totalPaginas) {
            var info = document.getElementById('paginationHistoricoInfo');
            var btnAnterior = document.getElementById('btnHistoricoAnterior');
            var btnProxima = document.getElementById('btnHistoricoProxima');

            if (totalItens === 0) {
                info.textContent = 'Nenhum resultado encontrado';
            } else {
                info.textContent = 'Página ' + paginaHistoricoAtual + ' de ' + totalPaginas;
            }

            btnAnterior.disabled = paginaHistoricoAtual <= 1;
            btnProxima.disabled = paginaHistoricoAtual >= totalPaginas;

            btnAnterior.classList.toggle('disabled', btnAnterior.disabled);
            btnProxima.classList.toggle('disabled', btnProxima.disabled);
        }

    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="icon" href="../assets/icon/favicon-bichos.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichos da Metrópole | Meu Bestiário</title>

    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body class="dashboard-page bestiario-page" onload="validarSessao(), carregarBestiario()">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="dashboard-brand" href="./dashboard.html" aria-label="Bichos da Metrópole - Dashboard">
                <img src="../assets/assets-home/Bichos da Metrópole em Pixel Art 1.png" alt="Bichos da Metrópole">
            </a>

            <nav class="dashboard-nav" aria-label="Navegação principal">
                <a class="dashboard-nav-item" href="./dashboard.html">Dashboard</a>
                <a class="dashboard-nav-item active" href="./cards.html">Meu Bestiário</a>
                <a class="dashboard-nav-item" href="./mural.html">Histórico</a>
            </nav>

            <a class="dashboard-action" href="./edicao-aviso.html"><span>Registrar avistamento</span></a>

            <span id="b_usuario" class="usuario-invisivel" aria-hidden="true">usuário</span>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <div class="dashboard-header-copy">
                    <h1>MEU BESTIÁRIO</h1>
                    <p>Explore sua coleção de espécies da cidade.</p>
                </div>
                <button class="dashboard-logout" type="button" onclick="limparSessao()"><span>Sair</span></button>
            </header>

            <section class="progress-card bestiario-progress" aria-label="Progresso da coleção">
                <div class="progress-header">
                    <h2>PROGRESSO DA COLEÇÃO</h2>
                    <strong><span class="progress-count discovered" id="especiesDescobertasTexto">0</span> / <span class="progress-count total" id="totalCatalogoTexto">40</span> espécies descobertas</strong>
                </div>

                <div class="progress-track" aria-hidden="true">
                    <div class="progress-fill" id="progressFill"></div>
                </div>

                <p class="progress-caption"><strong id="progressPercent">0%</strong> do catálogo já descoberto</p>
            </section>

            <section class="search-section" aria-label="Busca e filtros">
                <label class="search-field" for="buscarEspecie">
                    <span class="usuario-invisivel">Buscar espécie</span>
                    <input id="buscarEspecie" type="search" placeholder="Buscar espécie" oninput="paginaAtual = 1; renderizarEspecies()">
                </label>

                <div class="tabs-filter" role="tablist" aria-label="Filtro de espécies">
                    <button class="tab-filter active" type="button" data-filter="todos" onclick="selecionarFiltro('todos')">Todos</button>
                    <button class="tab-filter" type="button" data-filter="descoberto" onclick="selecionarFiltro('descoberto')">Descobertos</button>
                    <button class="tab-filter" type="button" data-filter="pendente" onclick="selecionarFiltro('pendente')">Pendentes</button>
                </div>
            </section>

            <section class="species-grid" id="speciesGrid" aria-label="Coleção de espécies"></section>

            <section class="pagination-bar" aria-label="Paginação do bestiário">
                <button class="pagination-button" type="button" id="btnAnterior" onclick="mudarPagina(-1)">Anterior</button>
                <span class="pagination-info" id="paginationInfo">Página 1 de 1</span>
                <button class="pagination-button" type="button" id="btnProxima" onclick="mudarPagina(1)">Próxima</button>
            </section>
        </main>
    </div>

    <script>
        let filtroAtual = 'todos';
        let especies = [];
        let paginaAtual = 1;
        let itensPorPagina = 6;
        let filtrosBestiario = {
            todos: null,
            descoberto: 'descoberto',
            pendente: 'pendente'
        };

        function carregarBestiario() {
            let idUsuario = sessionStorage.ID_USUARIO;

            fetch(`/especies/bestiario/${idUsuario}`, { cache: 'no-store' }).then(function (response) {
                if (response.ok) {
                    response.json().then(function (resultado) {
                        especies = resultado;
                        atualizarResumoBestiario();
                        paginaAtual = 1;
                        renderizarEspecies();
                    });
                } else {
                    console.error('Nenhum dado encontrado ou erro na API');
                }
            }).catch(function (erro) {
                console.error('Erro ao carregar o bestiário:', erro.message);
            });
        }

        function atualizarResumoBestiario() {
            let totalCatalogo = especies.length;
            let totalEspecies = 0;

            for (let i = 0; i < especies.length; i++) {
                if (especies[i].status === 'descoberto') {
                    totalEspecies++;
                }
            }

            let progresso = totalCatalogo > 0 ? Math.round((totalEspecies / totalCatalogo) * 100) : 0;

            document.getElementById('especiesDescobertasTexto').textContent = totalEspecies;
            document.getElementById('totalCatalogoTexto').textContent = totalCatalogo;
            document.getElementById('progressPercent').textContent = progresso + '%';
            document.getElementById('progressFill').style.width = progresso + '%';
        }

        function selecionarFiltro(filtro) {
            filtroAtual = filtro;
            paginaAtual = 1;

            let botoes = document.querySelectorAll('.tab-filter');
            for (let i = 0; i < botoes.length; i++) {
                botoes[i].classList.remove('active');
            }

            let botaoAtivo = document.querySelector('.tab-filter[data-filter="' + filtro + '"]');
            if (botaoAtivo) {
                botaoAtivo.classList.add('active');
            }

            renderizarEspecies();
        }

        function mudarPagina(direcao) {
            let paginas = obterQuantidadePaginas();
            let proximaPagina = paginaAtual + direcao;

            if (proximaPagina < 1 || proximaPagina > paginas) {
                return;
            }

            paginaAtual = proximaPagina;
            renderizarEspecies();
        }

        function renderizarEspecies() {
            let busca = document.getElementById('buscarEspecie').value.toLowerCase().trim();
            let grid = document.getElementById('speciesGrid');
            grid.innerHTML = '';

            let especiesFiltradas = [];
            let statusFiltro = filtrosBestiario[filtroAtual];

            for (let i = 0; i < especies.length; i++) {
                let especie = especies[i];
                let combinaFiltro = statusFiltro == null || especie.status === statusFiltro;
                let combinaBusca = especie.nomePopular.toLowerCase().indexOf(busca) !== -1 || especie.nomeCientifico.toLowerCase().indexOf(busca) !== -1 || especie.grupo.toLowerCase().indexOf(busca) !== -1;

                if (!combinaFiltro || !combinaBusca) {
                    continue;
                }

                especiesFiltradas.push(especie);
            }

            let totalPaginas = especiesFiltradas.length > 0 ? Math.ceil(especiesFiltradas.length / itensPorPagina) : 1;

            if (paginaAtual > totalPaginas) {
                paginaAtual = totalPaginas;
            }

            let inicio = (paginaAtual - 1) * itensPorPagina;
            let fim = inicio + itensPorPagina;
            let especiesDaPagina = especiesFiltradas.slice(inicio, fim);

            for (let j = 0; j < especiesDaPagina.length; j++) {
                let especiePagina = especiesDaPagina[j];

                grid.innerHTML += `
                    <article class="species-card ${especiePagina.status}">
                        <div class="species-image-wrap">
                            <img class="species-image" src="${obterImagemEspecie(especiePagina)}" alt="${especiePagina.nomePopular}">
                            <span class="species-badge">${especiePagina.status === 'descoberto' ? 'Descoberto' : 'Pendente'}</span>
                        </div>
                        <div class="species-content">
                            <div class="species-title-row">
                                <h3>${especiePagina.nomePopular}</h3>
                                <span>${especiePagina.grupo}</span>
                            </div>
                            <p>${especiePagina.nomeCientifico}</p>
                        </div>
                    </article>
                `;
            }

            atualizarPaginacao(especiesFiltradas.length, totalPaginas);
        }

        function obterQuantidadePaginas() {
            let busca = document.getElementById('buscarEspecie').value.toLowerCase().trim();
            let totalFiltrado = 0;
            let statusFiltro = filtrosBestiario[filtroAtual];

            for (let i = 0; i < especies.length; i++) {
                let especie = especies[i];
                let combinaFiltro = statusFiltro == null || especie.status === statusFiltro;
                let combinaBusca = especie.nomePopular.toLowerCase().indexOf(busca) !== -1 || especie.nomeCientifico.toLowerCase().indexOf(busca) !== -1 || especie.grupo.toLowerCase().indexOf(busca) !== -1;

                if (combinaFiltro && combinaBusca) {
                    totalFiltrado++;
                }
            }

            return totalFiltrado > 0 ? Math.ceil(totalFiltrado / itensPorPagina) : 1;
        }

        function atualizarPaginacao(totalItens, totalPaginas) {
            let info = document.getElementById('paginationInfo');
            let btnAnterior = document.getElementById('btnAnterior');
            let btnProxima = document.getElementById('btnProxima');

            info.textContent = 'Página ' + paginaAtual + ' de ' + totalPaginas;
            btnAnterior.disabled = paginaAtual <= 1;
            btnProxima.disabled = paginaAtual >= totalPaginas;

            btnAnterior.classList.toggle('disabled', btnAnterior.disabled);
            btnProxima.classList.toggle('disabled', btnProxima.disabled);

            if (totalItens === 0) {
                info.textContent = 'Nenhum resultado encontrado';
            }
        }

        function obterImagemEspecie(especie) {
            if (especie.imagemPath != undefined && especie.imagemPath != null && especie.imagemPath.trim() !== '') {
                return encodeURI(especie.imagemPath);
            }

            return obterImagemPadrao(especie.nomePopular);
        }

        function obterImagemPadrao(nomePopular) {
            let iniciais = nomePopular.split(' ').map(function (parte) {
                return parte.charAt(0);
            }).join('').substring(0, 2).toUpperCase();

            return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">' +
                '<rect width="600" height="400" fill="#0b0b0b"/>' +
                '<rect x="18" y="18" width="564" height="364" fill="none" stroke="#2ef0b7" stroke-opacity="0.22" stroke-width="2"/>' +
                '<text x="300" y="206" fill="#2ef0b7" fill-opacity="0.75" font-family="Arial, sans-serif" font-size="72" font-weight="700" text-anchor="middle">' + iniciais + '</text>' +
                '<text x="300" y="252" fill="#8d8d8d" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">Imagem em breve</text>' +
                '</svg>'
            );
        }
    </script>
</body>

</html>
